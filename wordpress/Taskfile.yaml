version: '3'

vars:
  # ディレクトリの絶対パスを取得し、md5sum → 先頭6文字 を使う例
  #   - Mac環境では `md5sum` が使えないことが多いので、
  #     Homebrewで coreutils を入れて `md5sum` を使うか、
  #     もしくは `md5 -q` などで対応してください。
  #
  # 例: 
  #   ディレクトリ /home/yourname/projects/wordpress
  #   → md5sum は 5d41402abc4b2a76b9719d911017c592 ... (例)
  #   → cut で頭6文字: 5d4140
  PROJECT_HASH:
    sh: echo -n $(pwd) | md5sum | cut -c1-6

env:
  ENV: dev
  # 「wp + ハッシュ」の形にする → e.g.  wp5d4140
  COMPOSE_PROJECT_NAME: wp-{{.PROJECT_HASH}}

tasks:
  list:
    dir: .
    cmds:
      - task --list-all

  wpup:
    dir: wordpress
    cmds:
      - docker compose up -d
  wpdn:
    dir: wordpress
    cmds:
      - docker compose down 
  wpin:
    dir: wordpress
    cmds:
      - docker compose exec -it --user www-data -w /var/www/html/wp-content wordpress bash
  wprb:
    dir: wordpress
    cmds:
      - docker-compose down && docker-compose rm -f && docker image prune -f && docker-compose up --build -d
  wprm:
    dir: wordpress
    cmds:
      - docker-compose down --rmi local -v

  wpversions:
    desc: "指定可能なWordPress公式イメージのタグ(PHP/WPバージョンの組み合わせ)をDocker Hubから検索して一覧表示する。 例: task wpversions FILTER=php7.4 / task wpversions FILTER=6.4"
    dir: wordpress
    cmds:
      - |
        FILTER="{{.FILTER}}"
        URL="https://hub.docker.com/v2/repositories/library/wordpress/tags?page_size=100&ordering=last_updated"
        if [ -n "$FILTER" ]; then
          URL="${URL}&name=${FILTER}"
        fi
        RESULT=$(curl -s "$URL" | grep -oE '"name"[[:space:]]*:[[:space:]]*"[^"]+"' | sed -E 's/.*"([^"]+)"$/\1/' | sort -u)
        if [ -z "$RESULT" ]; then
          echo "該当タグなし、またはDocker Hub APIへの問い合わせに失敗しました。FILTERを変えるかネットワーク接続を確認してください。"
        else
          echo "$RESULT" | wc -l | xargs -I{} echo "{} 件表示 (page_size=100, 100件超は FILTER でさらに絞り込んでください)"
          echo "$RESULT"
          echo "→ WORDPRESS_TAG=<上記のタグ> を wordpress/.env に設定して 'task wprb' で再ビルドしてください。"
        fi

