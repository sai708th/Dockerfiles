version: '3.8'

services:
  wordpress:
    build:
      context: .
      dockerfile: wordpress.df
      args:
        WORDPRESS_TAG: ${WORDPRESS_TAG:-latest}   # ベースイメージのタグ(PHP_VERSIONから合成)。.env参照
        PHP_VERSION: ${PHP_VERSION:-}             # 記録用(label)。ベースイメージ選択はWORDPRESS_TAGが担う
        WP_VERSION: ${WP_VERSION:-}               # 指定時、wp-cliでこのWPコアバージョンに強制downgrade/upgrade
        WPCLI_VERSION: ${WPCLI_VERSION:-}         # 指定時、wp-cliをこのバージョンに固定(古いPHP互換用)
    ports:
      - "8081:80"   
      - "8443:443" 
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: exampleuser
      WORDPRESS_DB_PASSWORD: examplepass
      WORDPRESS_DB_NAME: exampledb
    volumes:
      - wordpress_data:/var/www/html
      - ./wp/wp-config.php:/var/www/html/wp-config.php  # wp-config.phpをバインドマウント
      - ./wp/wp-content:/var/www/html/wp-content  # wp-contentディレクトリをバインドマウント
    networks:
      - wordpress_network

  db:
    image: mariadb:latest
    environment:
      MYSQL_DATABASE: exampledb
      MYSQL_USER: exampleuser
      MYSQL_PASSWORD: examplepass
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress_network

volumes:
  wordpress_data:
  db_data:

networks:
  wordpress_network:
